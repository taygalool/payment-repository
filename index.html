<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahal Payment Gateway</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 15px;
        }
        h2 { font-size: 18px; margin-bottom: 8px; }
        p { font-size: 13px; color: #666; margin-bottom: 15px; }
        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }
        .pay-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Bixinta Bilaha ah ($1.00)</h2>
    <p>Geli lambarkaaga taleefanka si aad u billowdo lacag-bixinta Sahal.</p>

    <div class="card">
        <input type="tel" id="phoneInput" placeholder="Tusaale: 90xxxxxxx ama 61xxxxxxx" />
        <a href="#" class="pay-btn" id="payBtn" onclick="triggerPayment(event)">📞 Bixi $1.00 (Dir USSD)</a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function triggerPayment(e) {
            e.preventDefault();
            let phone = document.getElementById('phoneInput').value.trim();
            
            if (!phone) {
                alert("Fadlan geli lambarkaaga taleefanka!");
                return;
            }

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // Merchant USSD structure: *884*MERCHANT*AMOUNT*PHONE#
            // Or passing through standard dialer with user's number prefix
            let ussdCode = `tel:*884*418029*1*${phone}#`;
            window.location.href = ussdCode;
        }
    </script>
</body>
</html>
